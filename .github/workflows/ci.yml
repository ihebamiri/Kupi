name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every action is pinned to a full commit SHA (tag in the comment). Update them with care.

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux ships first; Windows is built and tested from day one so the
        # port stays cheap.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Go formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l internal main.go)" || (gofmt -l internal main.go; exit 1)
      - name: Go vet
        run: go vet ./...
      - name: Go tests (includes architecture rules)
        run: go test ./...
      - name: Build the app
        run: go build -tags production -o kupi-ci .

  integration:
    name: Integration (k3d)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install k3d (built from source, verified by the Go checksum database)
        run: go install github.com/k3d-io/k3d/v5@v5.9.0
      - name: Create test cluster
        run: k3d cluster create kupi-test --api-port 127.0.0.1:6550 --wait
      - name: Integration tests
        run: go test -tags integration -count=1 ./internal/...

  vulnerabilities:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Placeholder frontend build for go:embed
        run: mkdir -p frontend/dist && echo '<!doctype html>' > frontend/dist/index.html
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
