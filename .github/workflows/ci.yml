name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# TODO before the repository goes public: pin every action to a full commit SHA.

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux ships first; Windows is built and tested from day one so the
        # port stays cheap.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Go vet
        run: go vet ./...
      - name: Go tests (includes architecture rules)
        run: go test ./...
      - name: Build the app
        run: go build -tags production -o kupi-ci .

  integration:
    name: Integration (k3d)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install k3d (built from source, verified by the Go checksum database)
        run: go install github.com/k3d-io/k3d/v5@v5.9.0
      - name: Create test cluster
        run: k3d cluster create kupi-test --api-port 127.0.0.1:6550 --wait
      - name: Integration tests
        run: go test -tags integration -count=1 ./internal/...

  vulnerabilities:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Placeholder frontend build for go:embed
        run: mkdir -p frontend/dist && echo '<!doctype html>' > frontend/dist/index.html
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
