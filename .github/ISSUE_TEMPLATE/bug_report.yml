name: Bug report
description: Something in Kupi doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For a **security problem**, don't use this form: see SECURITY.md to report it privately.
        Please don't paste Secret values, tokens or kubeconfig contents here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include the exact error message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to a k3d cluster
        2. Open Map, select the Deployment …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kupi version
      description: Shown at the bottom of the sidebar.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux (Ubuntu or Debian)
        - Linux (Fedora or RHEL)
        - Linux (other)
    validations:
      required: true
  - type: input
    id: cluster
    attributes:
      label: Cluster
      description: Kind of cluster and Kubernetes version.
      placeholder: k3d 5.9, Kubernetes 1.35 / EKS 1.36 / …
  - type: dropdown
    id: profile
    attributes:
      label: Cluster profile in Kupi
      options:
        - Local
        - Dev
        - Staging
        - Production
        - Not sure
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Screenshots help a lot (Win+Shift+S on Windows).
