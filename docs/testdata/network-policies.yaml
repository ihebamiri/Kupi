# NetworkPolicies for testing "Check traffic" on the map. Apply after the
# multi-object manifest has created the namespace kupi-multi.
#
# Pods in kupi-multi accept no traffic, except the hello pods, which accept
# their "http" port (8080) from the ticker pods in kupi-demo. k3s enforces
# NetworkPolicies with its built-in controller, so the answers Kupi gives can
# be checked with real requests.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: kupi-multi
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hello-from-ticker
  namespace: kupi-multi
spec:
  podSelector:
    matchLabels:
      app: hello
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kupi-demo
          podSelector:
            matchLabels:
              app: ticker
      ports:
        - port: http
