# Project configuration used by Wails to generate build assets.
# After changing `info`, run `wails3 task common:update:build-assets`.
version: '3'

info:
  companyName: "Kupi contributors"
  productName: "Kupi"
  productIdentifier: "io.github.ihebamiri.kupi"
  description: "Kubernetes Pilot: a desktop app for managing Kubernetes clusters"
  copyright: "Copyright 2026 Kupi contributors. Licensed under Apache 2.0."
  comments: "Kupi - Kubernetes Pilot"
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
